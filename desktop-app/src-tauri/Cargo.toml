[package]
name = "app"
version = "1.0.7"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
# Windows API: Gdi を追加（BitBlt, ClientToScreen, PrintWindow など）
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
] }
# 画像処理（PNG保存）
image = { version = "0.25", default-features = false, features = ["png"] }
# データ並列処理（行単位投票の並列化）
rayon = "1.10"
# クリップボードへの画像コピー
arboard = "3.4"
base64 = "0.22"
# エラー型の derive マクロ
thiserror = "1.0"
# 非同期ランタイム（Tauri が既に使用する tokio と同一バージョン）
tokio = { version = "1", features = ["time"] }
imageproc = "0.25.1"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2.3.2"
# Windows Credential Manager 連携（windows-native 必須。未指定時は mock で永続化されない）
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
